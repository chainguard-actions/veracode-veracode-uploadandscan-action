name: Test optional scan flags with invalid Veracode credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: "false"
          filepath: binaries_to_upload
          version: test-version
          vid: invalid-vid
          vkey: invalid-vkey
          createsandbox: "true"
          sandboxname: test-sandbox
          scantimeout: "5"
          deleteincompletescan: "true"
          scanpollinginterval: "30"
          javawrapperversion: "23.8.12.0"
          debug: "true"
          includenewmodules: "true"
          maxretrycount: "1"
      - name: Assert scan did not succeed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid Veracode credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
