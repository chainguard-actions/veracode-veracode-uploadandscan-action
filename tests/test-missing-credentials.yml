name: Test missing credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: "false"
          filepath: binaries_to_upload
          version: test-version
          vid: ""
          vkey: ""
      - name: Assert action failed on missing required parameters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when vid/vkey are empty"
            exit 1
          fi
          echo "PASS"
