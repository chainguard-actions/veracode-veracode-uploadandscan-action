name: Test basic flow with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          mkdir -p /tmp/veracode-test
          echo "dummy binary content" > /tmp/veracode-test/app.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: my-test-app
          createprofile: true
          filepath: /tmp/veracode-test/app.jar
          version: test-scan-1
          vid: fake-vid-12345
          vkey: fake-vkey-67890

      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either:
          # - fail (expected: fake credentials rejected by Veracode API or Java wrapper)
          # - succeed (unexpected in test environment)
          # Either way, it must not be skipped or produce an unexpected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (possibly in a mocked environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
