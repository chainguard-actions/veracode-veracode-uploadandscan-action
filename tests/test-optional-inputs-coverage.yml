name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy scan target
        run: |
          mkdir -p /tmp/scan-target
          echo "dummy content" > /tmp/scan-target/app.jar
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: false
          filepath: /tmp/scan-target/app.jar
          version: test-scan-v1
          vid: fake-vid
          vkey: fake-vkey
          createsandbox: false
          sandboxname: test-sandbox
          scantimeout: 60
          exclude: "*.xml"
          include: "*.jar"
          criticality: VeryHigh
          pattern: "(.+)\\.jar"
          replacement: "$1-renamed.jar"
          scanallnonfataltoplevelmodules: false
          selected: false
          selectedpreviously: false
          teams: test-team
          toplevel: false
          deleteincompletescan: 1
          scanpollinginterval: 30
          javawrapperversion: 23.7.10.1
          debug: true
          includenewmodules: false
          maxretrycount: 3
      - name: Assert action ran (expected to fail with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with fake Veracode credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
