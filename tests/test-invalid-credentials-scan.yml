name: Test upload-and-scan with invalid Veracode credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean any previous generated wrapper script
        run: rm -f "$GITHUB_WORKSPACE/runJava.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: "false"
          filepath: binaries_to_upload
          version: test-version
          vid: invalid-vid
          vkey: invalid-vkey
          criticality: High
          teams: test-team
      - name: Assert scan did not succeed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid Veracode credentials, got '$OUTCOME'"
            exit 1
          fi
          F="$GITHUB_WORKSPACE/runJava.sh"
          if [ -f "$F" ]; then
            echo "Generated wrapper script:"
            sed 's/-vid .*/-vid ***/; s/-vkey .*/-vkey ***/' "$F"
            for flag in '-action "uploadandscan"' '-appname "test-app"' '-autoscan "true"' '-criticality "High"' '-teams "test-team"' '-createprofile "false"'; do
              if ! grep -qF -- "$flag" "$F"; then
                echo "FAIL: wrapper script missing: $flag"
                exit 1
              fi
            done
          else
            echo "runJava.sh not in workspace root; skipping content checks"
          fi
          echo "PASS"
