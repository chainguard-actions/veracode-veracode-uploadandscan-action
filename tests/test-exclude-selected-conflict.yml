name: Test exclude and selected conflict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          mkdir -p /tmp/veracode-test
          echo "dummy binary content" > /tmp/veracode-test/app.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: true
          filepath: /tmp/veracode-test/app.jar
          version: test-scan-1
          vid: fake-vid
          vkey: fake-vkey
          exclude: 'SomeModule'
          selected: 'true'

      - name: Assert action failed due to exclude+selected conflict
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both exclude and selected are set, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when exclude and selected are both provided"
