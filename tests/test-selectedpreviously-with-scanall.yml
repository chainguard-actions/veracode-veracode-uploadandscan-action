name: Test selectedpreviously combined with scanallnonfataltoplevelmodules is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: "false"
          filepath: binaries_to_upload
          version: test-version
          vid: invalid-vid
          vkey: invalid-vkey
          selectedpreviously: "true"
          scanallnonfataltoplevelmodules: "true"
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for conflicting module selection inputs, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
