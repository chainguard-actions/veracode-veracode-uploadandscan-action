name: Test sandboxname with sandboxid fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: test-app
          createprofile: "false"
          filepath: binaries_to_upload
          version: test-version
          vid: dummy-vid
          vkey: dummy-vkey
          sandboxname: my-sandbox
          sandboxid: "12345"
      - name: Assert action rejected conflicting sandbox inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both sandboxname and sandboxid are set"
            exit 1
          fi
          echo "PASS"
