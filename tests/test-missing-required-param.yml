name: Test missing required parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy file to upload
        run: |
          mkdir -p /tmp/veracode-test
          echo "dummy content" > /tmp/veracode-test/app.jar

      - id: action
        uses: .
        continue-on-error: true
        with:
          appname: "test-app"
          createprofile: "true"
          filepath: "/tmp/veracode-test/app.jar"
          version: "test-scan-1.0"
          # vid and vkey intentionally omitted to trigger missing required parameter error

      - name: Assert action failed due to missing required parameters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required parameters (vid, vkey) are missing"
          else
            echo "FAIL: expected action to fail when required parameters are missing, got '$OUTCOME'"
            exit 1
          fi
